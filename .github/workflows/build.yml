name: Build Custom OS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib nasm grub-pc-bin grub-common xorriso mtools

      - name: Compile kernel
        run: make

      - name: Build ISO
        run: |
          chmod +x build_iso.sh
          ./build_iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-os-iso
          path: os.iso
          retention-days: 14
